gui:
    theme:
        activeBorderColor:
            - green
            - bold
        inactiveBorderColor:
            - "#547998"
        searchingActiveBorderColor:
            - "#547998"
git:
    diffRenderers:
        - command: delta --dark --paging=never
          name: delta
        - command: delta --dark --paging=never --side-by-side
          name: side-by-side
